<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新标签页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='11' cy='11' r='7' fill='%234a7c9b'/%3E%3Cpath d='m16.5 16.5 4 4' stroke='%234a7c9b' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  /* ===== 基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    color: #1f2937;
  }

  /* ===== 背景层 ===== */
  .bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 800px at 20% 15%, rgba(74, 124, 155, .55), transparent 60%),
      radial-gradient(1000px 700px at 85% 80%, rgba(123, 94, 167, .5), transparent 60%),
      linear-gradient(160deg, #1c2735 0%, #2a2138 55%, #171d29 100%);
    background-size: cover;
    background-position: center;
  }
  .bg.has-img { background-color: #111; }
  .shade {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .18);
  }

  /* ===== 主区域：搜索框居中偏上 ===== */
  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 18vh;
  }
  /* ===== 页面 Logo ===== */
  .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    min-height: 80px;
  }
  .logo-text {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: -1px;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .35);
    user-select: none;
  }
  #logoImage {
    max-height: 80px;
    max-width: 320px;
    object-fit: contain;
  }

  .search-wrap { position: relative; width: min(640px, 92vw); }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    height: 64px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 32px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
    transition: box-shadow .2s ease, background .2s ease;
  }
  .search-bar:focus-within {
    background: rgba(255, 255, 255, .96);
    box-shadow: 0 10px 36px rgba(0, 0, 0, .26);
  }

  .engine-btn {
    width: 48px; height: 48px;
    flex: none;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .engine-btn:hover { background: rgba(0, 0, 0, .06); }

  /* 引擎图标统一尺寸：
     SVG 只有 viewBox 没有 width/height 时，浏览器按替换元素默认值 300×150 渲染，
     会把按钮和菜单项全部撑爆——必须显式约束。

     注意选择器不要写成 `.engine-btn svg, .badge svg` 这种合并规则：
     搜索框里的图标同时命中 .engine-btn svg 和 .badge svg，
     两条特异性相同、后者写在后面会覆盖前者，导致改 .engine-btn svg 根本不生效。
     这里按容器分开写，互不干扰。 */
  .engine-btn .badge {
    width: 40px;
    height: 40px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .engine-btn .badge svg {
    width: 40px;
    height: 40px;
    display: block;
    flex: none;
  }
  .engine-item svg {
    width: 26px;
    height: 26px;
    display: block;
    flex: none;
  }
  .engine-item .badge { width: 26px; height: 26px; flex: none; }

  #searchInput {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    color: #1f2937;
  }
  #searchInput::placeholder { color: #6b7280; }

  #searchBtn {
    width: 48px; height: 48px;
    flex: none;
    border: none;
    border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: #374151;
  }
  #searchBtn:hover { background: rgba(0, 0, 0, .06); }
  #searchBtn svg { width: 28px; height: 28px; }

  /* ===== 搜索引擎切换菜单 ===== */
  .engine-menu {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 264px;
    padding: 6px;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .22);
    z-index: 20;
  }
  .engine-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    color: #1f2937;
    text-align: left;
  }
  .engine-item:hover { background: rgba(0, 0, 0, .06); }
  .engine-item .badge { width: 24px; height: 24px; flex: none; }
  .engine-item.active { font-weight: 600; }
  .engine-item .check { margin-left: auto; flex: none; color: #2563eb; }

  /* ===== 右上角设置按钮 ===== */
  .icon-btn {
    position: fixed;
    top: 20px; right: 20px;
    width: 42px; height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, .35);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 25;
    transition: background .2s ease;
  }
  .icon-btn:hover { background: rgba(0, 0, 0, .55); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* ===== 设置面板 ===== */
  .panel {
    position: fixed;
    top: 74px; right: 20px;
    width: 300px;
    background: rgba(22, 26, 34, .9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 18px;
    color: #fff;
    z-index: 30;
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 18px 10px;
  }
  .panel-head h2 { font-size: 16px; font-weight: 600; }
  .panel-close {
    position: static;
    width: 30px; height: 30px;
    background: transparent;
  }
  .panel-close:hover { background: rgba(255, 255, 255, .12); }
  .panel-body {
    padding: 4px 18px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .primary-btn, .ghost-btn {
    height: 42px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
  }
  .primary-btn {
    background: #fff;
    color: #1f2937;
    font-weight: 600;
  }
  .primary-btn:hover { background: #eee; }
  .ghost-btn {
    background: rgba(255, 255, 255, .12);
    color: #fff;
  }
  .ghost-btn:hover { background: rgba(255, 255, 255, .2); }
  .section-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, .7);
    margin-top: 6px;
  }
  .section-label:first-child { margin-top: 0; }
  .tip {
    font-size: 12px;
    line-height: 1.7;
    color: rgba(255, 255, 255, .6);
  }

  /* ===== 窄屏适配 ===== */
  @media (max-width: 500px) {
    .stage { padding-top: 14vh; }
    .logo-area { margin-bottom: 20px; min-height: 56px; }
    .logo-text { font-size: 40px; }
    #logoImage { max-height: 56px; max-width: 240px; }
    .search-bar { height: 58px; padding: 6px 8px; }
    .panel { width: calc(100vw - 40px); right: 20px; }
  }
</style>
</head>
<body>

<div class="bg" id="bgLayer" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>

<!-- 右上角设置按钮 -->
<button id="settingsBtn" class="icon-btn" aria-label="壁纸设置" title="壁纸设置">
  <svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.63,9.08 2.69,9.34 2.86,9.48l2.03,1.58C4.84,10.36 4.8,11.65 4.8,12.94s0.02,0.64 0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54 c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44-0.17 0.47-0.41l0.36-2.54c0.59-0.24 1.13-0.56 1.62-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59-0.22l1.92-3.32c0.12-0.22 0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/>
  </svg>
</button>

<!-- 搜索区 -->
<main class="stage">
  <div class="logo-area">
    <div class="logo-text" id="logoText" aria-label="Google">Google</div>
    <img id="logoImage" alt="页面标志" hidden>
  </div>
  <div class="search-wrap">
    <form class="search-bar" id="searchForm">
      <button type="button" id="engineBtn" class="engine-btn" aria-label="更换搜索引擎" title="更换搜索引擎">
        <span id="engineIconWrap" class="badge"></span>
      </button>
      <input id="searchInput" type="text" placeholder="搜索，或输入网址" autocomplete="off" spellcheck="false">
      <button type="submit" id="searchBtn" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
    </form>
    <div id="engineMenu" class="engine-menu" hidden></div>
  </div>
</main>

<!-- 设置面板 -->
<aside id="panel" class="panel" hidden>
  <div class="panel-head">
    <h2>外观设置</h2>
    <button id="closePanel" class="icon-btn panel-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="section-label">壁纸</div>
    <button id="uploadBtn" class="primary-btn">选择本地图片作为壁纸</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button id="resetBg" class="ghost-btn">恢复默认壁纸</button>
    <div class="section-label">页面标志（Logo）</div>
    <button id="logoUploadBtn" class="primary-btn">选择本地图片作为 Logo</button>
    <input type="file" id="logoFileInput" accept="image/*" hidden>
    <button id="resetLogo" class="ghost-btn">恢复默认 Logo</button>
    <p class="tip">壁纸、Logo 与搜索引擎选择均保存在本机浏览器中，下次打开自动保留；请不要移动本 HTML 文件的存放位置。</p>
  </div>
</aside>

<script src="engines.js"></script>
<script src="ntp.js"></script>
</body>
</html>
